<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Erro')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="error-page">
        <span class="error-code" th:text="${status} ?: 'Erro'">Erro</span>
        <h1 class="h3 fw-bold">Algo deu errado</h1>
        <p class="text-body-secondary">Não foi possível concluir sua solicitação. Tente novamente em instantes.</p>
        <a class="btn btn-primary" th:href="@{/}">Voltar para o início</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
