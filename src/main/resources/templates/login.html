<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5" style="max-width: 420px">
  <h2 class="mb-4">Entrar</h2>

  <div th:if="${param.error}" class="alert alert-danger">E-mail ou senha inválidos, ou conta desativada.</div>
  <div th:if="${param.registered}" class="alert alert-primary">Cadastro feito! Agora é só entrar.</div>

  <form th:action="@{/login}" method="post">
    <div class="mb-3">
      <label class="form-label" for="email">E-mail</label>
      <input class="form-control" type="email" id="email" name="email" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Senha</label>
      <input class="form-control" type="password" id="password" name="password" required>
    </div>
    <button class="btn btn-primary w-100" type="submit">Entrar</button>
  </form>

  <p class="mt-3 text-center">Não tem conta? <a th:href="@{/register}">Cadastre-se</a></p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
