<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ocorrências')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <h2 class="mb-3">Ocorrências</h2>

    <div th:if="${param.notFound}" class="alert alert-warning">Ocorrência não encontrada.</div>

    <form th:action="@{/issues}" method="get" class="row g-2 mb-4">
        <div class="col-md-3">
            <select name="typeId" class="form-select">
                <option value="">Todos os tipos</option>
                <option th:each="t : ${types}" th:value="${t.id}" th:text="${t.name}"
                        th:selected="${t.id == typeId}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <select name="status" class="form-select">
                <option value="">Todos os status</option>
                <option th:each="s : ${statusLabels}" th:value="${s.key}" th:text="${s.value}"
                        th:selected="${s.key == status}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <input name="neighborhood" class="form-control" placeholder="Bairro" th:value="${neighborhood}">
        </div>
        <div class="col-md-2">
            <input type="date" name="from" class="form-control" th:value="${from}" title="De">
        </div>
        <div class="col-md-2">
            <input type="date" name="to" class="form-control" th:value="${to}" title="Até">
        </div>
        <div class="col-12">
            <button class="btn btn-success" type="submit">Filtrar</button>
            <a class="btn btn-outline-secondary" th:href="@{/issues}">Limpar</a>
        </div>
    </form>

    <p class="text-muted" th:text="${page.totalElements} + ' ocorrência(s) encontrada(s)'"></p>

    <div th:if="${page.empty}" class="alert alert-light border">Nenhuma ocorrência encontrada com esses filtros.</div>

    <div class="table-responsive" th:unless="${page.empty}">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th>Título</th>
                <th>Tipo</th>
                <th>Bairro</th>
                <th>Status</th>
                <th>Gravidade</th>
                <th>Abertura</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="i : ${page.content}">
                <td><a th:href="@{/issues/{id}(id=${i.id})}" th:text="${i.title}"></a></td>
                <td th:text="${i.issueType}"></td>
                <td th:text="${i.neighborhood} ?: '-'"></td>
                <td>
                    <span class="badge" th:classappend="${i.resolved} ? 'bg-success' : 'bg-warning text-dark'"
                          th:text="${statusLabels[i.status]} ?: ${i.status}"></span>
                </td>
                <td th:text="${i.severity != null} ? ${severityLabels[i.severity.name()]} : '-'"></td>
                <td th:text="${#temporals.format(i.openingDate, 'dd/MM/yyyy HH:mm')}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${page.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/issues(page=${page.number - 1}, typeId=${typeId}, status=${status}, neighborhood=${neighborhood}, from=${from}, to=${to})}">Anterior</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="${page.number + 1} + ' de ' + ${page.totalPages}"></span>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/issues(page=${page.number + 1}, typeId=${typeId}, status=${status}, neighborhood=${neighborhood}, from=${from}, to=${to})}">Próxima</a>
            </li>
        </ul>
    </nav>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
