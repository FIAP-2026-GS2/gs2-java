<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Chat')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4" style="max-width: 760px">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="m-0">Assistente SampaTech</h2>
        <form th:action="@{/chat}" method="post" th:unless="${#lists.isEmpty(conversation)}" class="m-0">
            <input type="hidden" name="clear" value="1">
            <button class="btn btn-outline-secondary btn-sm" type="submit">Nova conversa</button>
        </form>
    </div>

    <p class="text-muted">
        Pergunte sobre as ocorrências da cidade. Exemplo: "Tem buraco aberto na Sé?"
    </p>

    <div sec:authorize="isAnonymous()" class="alert alert-light border small">
        <a th:href="@{/login}">Entre</a> para salvar suas conversas no histórico.
    </div>

    <div class="mb-3">
        <div th:each="m : ${conversation}" class="mb-3">
            <div class="d-flex justify-content-end">
                <div class="bg-success text-white rounded p-2 px-3" style="max-width: 80%" th:text="${m.question}"></div>
            </div>
            <div class="d-flex justify-content-start mt-2">
                <div class="bg-light border rounded p-2 px-3" style="max-width: 80%; white-space: pre-line" th:text="${m.answer}"></div>
            </div>
        </div>
    </div>

    <form th:action="@{/chat}" method="post" class="d-flex gap-2"
          onsubmit="const b = this.querySelector('button'); b.disabled = true; b.innerText = 'Pensando...';">
        <input name="message" class="form-control" placeholder="Digite sua pergunta" maxlength="1000" required autofocus>
        <button class="btn btn-success" type="submit">Enviar</button>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
