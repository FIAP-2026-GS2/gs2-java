<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Órgão municipal')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/admin :: tabs('agencies')}"></div>

    <div class="card border-0 shadow-sm" style="max-width: 720px">
        <div class="card-body p-4">
            <h2 class="h5 fw-bold mb-4" th:text="${agencyId == null} ? 'Novo órgão municipal' : 'Editar órgão municipal'"></h2>

            <form th:action="${agencyId == null} ? @{/admin/agencies} : @{/admin/agencies/{id}(id=${agencyId})}"
                  th:object="${form}" method="post" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="name">Nome</label>
                    <input class="form-control" id="name" th:field="*{name}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="description">Descrição</label>
                    <textarea class="form-control" id="description" rows="3" th:field="*{description}" th:errorclass="is-invalid"></textarea>
                    <div class="invalid-feedback" th:errors="*{description}"></div>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-5">
                        <label class="form-label" for="city">Cidade</label>
                        <input class="form-control" id="city" th:field="*{city}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{city}"></div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label" for="state">UF</label>
                        <input class="form-control text-uppercase" id="state" maxlength="2" th:field="*{state}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{state}"></div>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label" for="subprefecture">Subprefeitura</label>
                        <input class="form-control" id="subprefecture" th:field="*{subprefecture}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{subprefecture}"></div>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Salvar</button>
                    <a class="btn btn-outline-secondary" th:href="@{/admin/agencies}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
