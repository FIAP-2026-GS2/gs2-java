<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Editar usuário')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/admin :: tabs('users')}"></div>

    <div class="card border-0 shadow-sm" style="max-width: 640px">
        <div class="card-body p-4">
            <h2 class="h5 fw-bold mb-1" th:text="${user.name}"></h2>
            <p class="text-body-secondary mb-4" th:text="${user.email}"></p>

            <form th:action="@{/admin/users/{id}(id=${user.id})}" th:object="${form}" method="post" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="userType">Tipo de usuário</label>
                    <select class="form-select" id="userType" th:field="*{userType}" th:errorclass="is-invalid">
                        <option th:each="t : ${userTypes}" th:value="${t}" th:text="${userTypeLabels[t.name()]}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{userType}"></div>
                </div>
                <div class="form-check form-switch mb-4">
                    <input class="form-check-input" type="checkbox" role="switch" th:field="*{active}">
                    <label class="form-check-label" th:for="${#ids.prev('active')}">Conta ativa</label>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Salvar</button>
                    <a class="btn btn-outline-secondary" th:href="@{/admin/users}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
