<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuários')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/admin :: tabs('users')}"></div>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Tipo</th>
                    <th>Cadastro</th>
                    <th>Situação</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${page.content}">
                    <td class="fw-semibold" th:text="${u.name}"></td>
                    <td th:text="${u.email}"></td>
                    <td><span class="badge text-bg-primary" th:text="${userTypeLabels[u.userType.name()]}"></span></td>
                    <td th:text="${#temporals.format(u.registrationDate, 'dd/MM/yyyy')}"></td>
                    <td>
                        <span class="badge" th:classappend="${u.active} ? 'text-bg-light border' : 'text-bg-secondary'"
                              th:text="${u.active} ? 'Ativo' : 'Inativo'"></span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/users/{id}/edit(id=${u.id})}">
                            <span class="icon icon-edit me-1" aria-hidden="true"></span>Editar
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-3">
        <nav th:replace="~{fragments/layout :: pagination(${page}, '/admin/users')}"></nav>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
