<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tipo de ocorrência')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/admin :: tabs('types')}"></div>

    <div class="card border-0 shadow-sm" style="max-width: 640px">
        <div class="card-body p-4">
            <h2 class="h5 fw-bold mb-4" th:text="${typeId == null} ? 'Novo tipo de ocorrência' : 'Editar tipo de ocorrência'"></h2>

            <form th:action="${typeId == null} ? @{/admin/issue-types} : @{/admin/issue-types/{id}(id=${typeId})}"
                  th:object="${form}" method="post" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="name">Nome</label>
                    <input class="form-control" id="name" th:field="*{name}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="category">Categoria</label>
                    <select class="form-select" id="category" th:field="*{category}" th:errorclass="is-invalid">
                        <option value="">Selecione</option>
                        <option th:each="c : ${categories}" th:value="${c}" th:text="${categoryLabels[c.name()]}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{category}"></div>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="description">Descrição</label>
                    <textarea class="form-control" id="description" rows="3" th:field="*{description}" th:errorclass="is-invalid"></textarea>
                    <div class="invalid-feedback" th:errors="*{description}"></div>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Salvar</button>
                    <a class="btn btn-outline-secondary" th:href="@{/admin/issue-types}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
