<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tipos de ocorrência')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/admin :: tabs('types')}"></div>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="d-flex justify-content-end mb-3">
        <a class="btn btn-primary" th:href="@{/admin/issue-types/new}">
            <span class="icon icon-plus me-2" aria-hidden="true"></span>Novo tipo
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>Categoria</th>
                    <th>Descrição</th>
                    <th>Situação</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${page.content}">
                    <td class="fw-semibold" th:text="${t.name}"></td>
                    <td>
                        <span class="icon me-1" th:classappend="${categoryIcons[t.category.name()]}" aria-hidden="true"></span>
                        <span th:text="${categoryLabels[t.category.name()]}"></span>
                    </td>
                    <td class="text-body-secondary small text-truncate" style="max-width: 280px" th:text="${t.description} ?: '-'"></td>
                    <td>
                        <span class="badge" th:classappend="${t.active} ? 'text-bg-light border' : 'text-bg-secondary'"
                              th:text="${t.active} ? 'Ativo' : 'Inativo'"></span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/issue-types/{id}/edit(id=${t.id})}">
                            <span class="icon icon-edit me-1" aria-hidden="true"></span>Editar
                        </a>
                        <form th:if="${t.active}" class="d-inline" method="post"
                              th:action="@{/admin/issue-types/{id}/deactivate(id=${t.id})}"
                              onsubmit="return confirm('Desativar este tipo de ocorrência?');">
                            <button class="btn btn-sm btn-outline-danger" type="submit">
                                <span class="icon icon-ban me-1" aria-hidden="true"></span>Desativar
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-3">
        <nav th:replace="~{fragments/layout :: pagination(${page}, '/admin/issue-types')}"></nav>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
