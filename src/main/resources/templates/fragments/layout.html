<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf?.token}">
  <meta name="_csrf_header" th:content="${_csrf?.headerName}">
  <title th:text="${title} + ' | SampaTech'">SampaTech</title>
  <script>
    (function () {
        var theme = null;
        try {
            theme = localStorage.getItem('sampatech-theme');
        } catch (e) {
        }
        if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-bs-theme', theme);
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
  <script th:src="@{/js/theme.js}" defer></script>
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg st-navbar sticky-top">
  <div class="container-fluid px-3 px-lg-4">
    <a class="navbar-brand st-brand d-flex align-items-center gap-2" th:href="@{/}">
      <span class="st-camera"></span>SampaTech
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
            aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav mx-auto gap-lg-3">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/issues}"><i class="fa-solid fa-map-location-dot me-1"></i>Ocorrências</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/chat}"><i class="fa-solid fa-comments me-1"></i>Chat</a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-2">
        <div class="theme-switch" role="group" aria-label="Tema">
          <span class="theme-switch-thumb"></span>
          <button type="button" class="theme-option" data-theme-value="dark" title="Modo escuro" aria-label="Modo escuro">
            <img class="theme-icon" th:src="@{/images/theme/moon.png}" alt="">
          </button>
          <button type="button" class="theme-option" data-theme-value="light" title="Modo claro" aria-label="Modo claro">
            <img class="theme-icon" th:src="@{/images/theme/sun.png}" alt="">
          </button>
        </div>

        <th:block sec:authorize="isAnonymous()">
          <a class="btn btn-outline-primary btn-sm" th:href="@{/login}">Entrar</a>
          <a class="btn btn-primary btn-sm" th:href="@{/register}">Cadastrar</a>
        </th:block>

        <div class="dropdown" sec:authorize="isAuthenticated()">
          <button class="avatar-btn dropdown-toggle" type="button" data-bs-toggle="dropdown"
                  aria-expanded="false" aria-label="Menu do usuário">
            <i class="fa-solid fa-user"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow-sm">
            <li><h6 class="dropdown-header" sec:authentication="name"></h6></li>
            <li>
              <a class="dropdown-item" th:href="@{/profile}"><i class="fa-solid fa-user me-2"></i>Meu perfil</a>
            </li>
            <li sec:authorize="hasRole('ADMIN')">
              <a class="dropdown-item" th:href="@{/admin/users}"><i class="fa-solid fa-gear me-2"></i>Administração</a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <form th:action="@{/logout}" method="post" class="m-0">
                <button class="dropdown-item text-danger" type="submit">
                  <i class="fa-solid fa-right-from-bracket me-2"></i>Sair
                </button>
              </form>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</nav>

<footer th:fragment="footer" class="text-center text-body-secondary py-4 mt-5 border-top">
  SampaTech · Portal da Transparência · FIAP Global Solution 2026

  <div id="chat-widget" class="chat-widget">
    <div id="chat-widget-panel" class="chat-panel" role="dialog" aria-label="Assistente SampaTech">
      <div class="chat-panel-header">
        <div class="d-flex align-items-center gap-2">
          <span class="chat-avatar"><span class="st-camera"></span></span>
          <div>
            <div class="fw-semibold">Assistente SampaTech</div>
            <div class="small opacity-75">Pergunte sobre as ocorrências</div>
          </div>
        </div>
        <div class="d-flex gap-1">
          <button type="button" id="chat-widget-reset" class="chat-icon-btn" title="Nova conversa" aria-label="Nova conversa">
            <i class="fa-solid fa-rotate-right"></i>
          </button>
          <button type="button" id="chat-widget-close" class="chat-icon-btn" title="Fechar" aria-label="Fechar">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>

      <div id="chat-widget-messages" class="chat-messages"></div>

      <div class="chat-login-hint" sec:authorize="isAnonymous()">
        <a th:href="@{/login}">Entre</a> para salvar suas conversas no histórico.
      </div>

      <form id="chat-widget-form" class="chat-form">
        <input id="chat-widget-input" type="text" class="form-control" placeholder="Digite sua pergunta"
               maxlength="1000" autocomplete="off">
        <button type="submit" class="btn btn-primary" aria-label="Enviar">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>

    <button type="button" id="chat-widget-toggle" class="chat-bubble" aria-label="Abrir chat" aria-expanded="false">
      <i class="fa-solid fa-comments chat-bubble-open"></i>
      <i class="fa-solid fa-xmark chat-bubble-close"></i>
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/chat-widget.js}"></script>
</footer>

</body>
</html>
