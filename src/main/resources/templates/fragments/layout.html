<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | SampaTech'">SampaTech</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-success">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/}">SampaTech</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" th:href="@{/issues}">Ocorrências</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/chat}">Chat</a></li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
          <a class="nav-link" th:href="@{/admin/users}">Admin</a>
        </li>
      </ul>

      <div sec:authorize="isAnonymous()" class="d-flex gap-2">
        <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Entrar</a>
        <a class="btn btn-light btn-sm" th:href="@{/register}">Cadastrar</a>
      </div>

      <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
        <a class="nav-link text-white" th:href="@{/profile}">Meu perfil</a>
        <form th:action="@{/logout}" method="post" class="m-0">
          <button class="btn btn-outline-light btn-sm" type="submit">Sair</button>
        </form>
      </div>
    </div>
  </div>
</nav>

<footer th:fragment="footer" class="text-center text-muted py-4 mt-5 border-top">
  SampaTech · Portal da Transparência · FIAP Global Solution 2026
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
