<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cadastro')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5" style="max-width: 420px">
  <h2 class="mb-4">Criar conta</h2>

  <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
    <div class="mb-3">
      <label class="form-label" for="name">Nome</label>
      <input class="form-control" id="name" th:field="*{name}" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{name}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="email">E-mail</label>
      <input class="form-control" type="email" id="email" th:field="*{email}" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{email}"></div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Senha</label>
      <input class="form-control" type="password" id="password" th:field="*{password}" th:errorclass="is-invalid">
      <div class="invalid-feedback" th:errors="*{password}"></div>
    </div>
    <button class="btn btn-primary w-100" type="submit">Cadastrar</button>
  </form>

  <p class="mt-3 text-center">Já tem conta? <a th:href="@{/login}">Entrar</a></p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
