spring:
  application:
    name: portal-service

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

  data:
    web:
      pageable:
        max-page-size: 50

  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://guest:guest@localhost:5672}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: 120